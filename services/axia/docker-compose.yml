name: axia

services:
  server:
    image: ${AXIA_SERVER_IMAGE:-axia-server:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    user: "${AXIA_SERVER_UID:-10001}:${AXIA_SERVER_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${AXIA_SERVER_MEMORY_LIMIT:-768m}
    stop_grace_period: 40s
    env_file:
      - path: ${AXIA_ENV_FILE:-/etc/axia/server.env}
        required: true
        format: raw
    environment:
      AXIA_SERVER_HOST: 0.0.0.0
      AXIA_SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - type: bind
        source: ${AXIA_SERVER_LOG_DIR:-/var/log/axia/server}
        target: /var/log/axia
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    healthcheck:
      test: [CMD, /opt/axia/bin/healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Both structured events and launcher stderr are persisted and rotated daily by host logrotate.
    logging:
      driver: none

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'snowykte0426/homeserver-setting'
    runs-on: [self-hosted, homeserver]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy changed files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BOOT_NOTIFIER_ENV: ${{ secrets.BOOT_NOTIFIER_ENV }}
        run: bash scripts/deploy.sh "$BEFORE" "$AFTER"

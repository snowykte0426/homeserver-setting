name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'snowykte0426/homeserver-setting'
    runs-on: [self-hosted, homeserver]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check AGENTS.md update
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            if echo "$changed" | grep -qvE '^(AGENTS\.md|CLAUDE\.md|README\.md)$' && ! echo "$changed" | grep -qx 'AGENTS.md'; then
              echo "::warning::저장소 파일이 바뀌었지만 AGENTS.md 는 갱신되지 않았습니다. 운영 문서도 함께 고쳤는지 확인하세요."
            fi
          fi

      - name: Deploy changed files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BOOT_NOTIFIER_ENV: ${{ secrets.BOOT_NOTIFIER_ENV }}
        run: bash scripts/deploy.sh "$BEFORE" "$AFTER"

server {
    listen 80;
    server_name kimtaeeun.site www.kimtaeeun.site;

    # >>> axia >>>
    # Add inside the existing kimtaeeun.site server block, alongside the other application proxies.
    # Cloudflare Flexible supplies the visitor scheme in X-Forwarded-Proto.
    location = /axia/api {
        absolute_redirect off;
        return 308 /axia/api/;
    }
    
    location /axia/api/ {
        proxy_pass         http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Prefix  /axia/api;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        client_max_body_size  25m;
    }
    # <<< axia <<<

    location /ready-gsm/ {
        proxy_pass         http://localhost:10101/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # >>> nxdi-api >>>
    # managed by NXDI server deployment
    location = /nxdi-api {
        return 308 /nxdi-api/;
    }

    location /nxdi-api/ {
        proxy_pass         http://127.0.0.1:10104/;
        proxy_http_version 1.1;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Prefix  /nxdi-api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    # <<< nxdi-api <<<

    # >>> sandrone >>>
    # managed by sandrone deployment
    location = /sandrone {
        absolute_redirect off;
        return 308 /sandrone/;
    }

    location /sandrone/ {
        proxy_pass         http://127.0.0.1:10105/sandrone/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        client_max_body_size  25m;
    }
    # <<< sandrone <<<
}
